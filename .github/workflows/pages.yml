name: Publish SPOOL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: online/package-lock.json
      - run: npm ci --prefix online
      - name: Reject known high-risk dependency vulnerabilities
        run: npm audit --prefix online --audit-level=high
      - name: Build and verify offline compatibility
        run: |
          node build-offline.mjs
          node tests/offline.test.mjs
      - name: Check data permissions and synchronization
        run: npm --prefix online test
      - name: Build public files
        run: node online/build.mjs
      - name: Verify browser security policy and bundle integrity
        run: node tests/online/hardening.test.mjs
      - name: Verify application under the Pages URL path
        env:
          SPOOL_TEST_BASE_PATH: /spool/
          SPOOL_CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node tests/online/browser.test.mjs
          node tests/online/auth-loading.browser.test.mjs
          node tests/online/sharing.browser.test.mjs
          node tests/search-layout.browser.test.mjs
          node tests/print-import.browser.test.mjs
          node tests/usability.browser.test.mjs
          node tests/inventory-improvements.browser.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload public files only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
